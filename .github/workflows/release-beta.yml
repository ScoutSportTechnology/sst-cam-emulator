name: release-beta

# Branch-scoped workflow that owns `release/**`.
#
# PRs into release/* run the three required CHECK jobs (lint/build/test). Pushes
# to a release/X.Y.Z branch build the artifact and mint the next beta prerelease
# vX.Y.Z-beta.N. Betas iterate on the branch. This is the artifact that
# release.yml later copies to the stable Release (main never builds). The two
# paths share one file but are mutually exclusive via event-name if-gates: checks
# run only on pull_request, the beta job runs only on push/dispatch.
#
# SEAM WINDOW NOTE: the bridge language is not chosen yet, so scripts/ci/build.sh
# and scripts/ci/test.sh are intentional no-ops (exit 0). That makes `Build` and
# `Test` green-by-no-op for now — the genuinely-failable gate today is `Lint`
# (shellcheck + actionlint). "Green" here means plumbing + lint pass, NOT that
# build/tests are enforced. When the bridge lands, the two seam scripts gain real
# commands and build/test become substantive with no workflow change.
#
# SEAM WINDOW (beta): scripts/ci/build.sh produces no artifact yet, so the beta is
# TAG-ONLY (prerelease Release, no asset). The upload step is conditional on a
# produced artifact under dist/ — same gate as the alpha job. When the bridge fills
# build.sh, the same step uploads the real artifact with no workflow change.
#
# Default GITHUB_TOKEN only (contents: write); the v* tag ruleset permits
# compliant prerelease tag creation, so no PAT/App is needed.

on:
  pull_request:
    branches: [release/**]
  push:
    branches: [release/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- CHECK jobs: PR gate only. Job name: values are ruleset required-status-
  # check contexts — do NOT rename them. ----
  lint:
    name: Lint (shellcheck + actionlint)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck ships preinstalled on ubuntu-latest runners.
      - name: Shellcheck CI scripts
        run: shellcheck scripts/ci/*.sh

      # Pinned actionlint — the genuinely-failable workflow-YAML gate.
      - name: Actionlint workflows
        uses: reviewdog/action-actionlint@v1.72.0

  build:
    name: Build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run build seam
        run: ./scripts/ci/build.sh

  test:
    name: Test
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test seam
        run: ./scripts/ci/test.sh

  # ---- Beta release job: push to release/X.Y.Z or manual dispatch. ----
  beta:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Branch is release/X.Y.Z — derive the base and fail fast on a bad name.
      - name: Derive release base
        id: base
        run: |
          base="${GITHUB_REF_NAME#release/}"
          if ! echo "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::branch '$GITHUB_REF_NAME' is not release/X.Y.Z"
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Resolve beta version
        id: ver
        run: ./scripts/ci/resolve-version.sh beta "${{ steps.base.outputs.base }}"

      - name: Build beta artifact
        run: ./scripts/ci/build.sh

      - name: Create beta prerelease (tag-only during seam window)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --prerelease \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "$TAG"

      # Upload ONLY IF build.sh produced an artifact. During the seam window
      # dist/ is empty, so this is skipped and the beta stays tag-only.
      - name: Upload beta artifact (if produced)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          shopt -s nullglob
          assets=(dist/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No artifact produced (seam window) — beta $TAG is tag-only."
            exit 0
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
