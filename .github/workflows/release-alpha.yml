name: release-alpha

# Branch-scoped workflow that owns `development`.
#
# PRs into development run the three required CHECK jobs (lint/build/test). Pushes to
# development (merged PRs) mint the next alpha prerelease. The two paths share one
# file but are mutually exclusive via event-name if-gates: checks run only on
# pull_request, the alpha job runs only on push/dispatch.
#
# SEAM WINDOW NOTE: the bridge language is not chosen yet, so scripts/ci/build.sh
# and scripts/ci/test.sh are intentional no-ops (exit 0). That makes `Build` and
# `Test` green-by-no-op for now — the genuinely-failable gate today is `Lint`
# (shellcheck + actionlint). "Green" here means plumbing + lint pass, NOT that
# build/tests are enforced. When the bridge lands, the two seam scripts gain real
# commands and build/test become substantive with no workflow change.
#
# SEAM WINDOW (alpha): scripts/ci/build.sh produces no artifact yet, so the alpha
# is TAG-ONLY (prerelease Release, no asset). The upload step is conditional on a
# produced artifact under dist/ — an unconditional upload of a nonexistent file
# would fail the run, so it must stay gated. When the bridge fills build.sh, the
# same step uploads the real artifact with no workflow change.
#
# Default GITHUB_TOKEN only (contents: write); the v* tag ruleset permits
# compliant prerelease tag creation, so no PAT/App is needed.

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      version:
        description: "Force base version eg v0.1.0 (overrides auto-detect)"
        required: false
        default: ""
      bump:
        description: "Force bump level (overrides auto-detect)"
        type: choice
        options: ["", patch, minor, major]
        default: ""

permissions:
  contents: write

concurrency:
  group: alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- CHECK jobs: PR gate only. Job name: values are ruleset required-status-
  # check contexts — do NOT rename them. ----
  lint:
    name: Lint (shellcheck + actionlint)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck ships preinstalled on ubuntu-latest runners.
      - name: Shellcheck CI scripts
        run: shellcheck scripts/ci/*.sh

      # Pinned actionlint — the genuinely-failable workflow-YAML gate.
      - name: Actionlint workflows
        uses: raviqqe/[email protected]

  build:
    name: Build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run build seam
        run: ./scripts/ci/build.sh

  test:
    name: Test
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test seam
        run: ./scripts/ci/test.sh

  # ---- Alpha release job: push to development (merged PR) or manual dispatch. ----
  alpha:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve alpha version
        id: ver
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUMP: ${{ inputs.bump }}
        run: ./scripts/ci/resolve-version.sh alpha

      - name: Build alpha artifact
        if: steps.ver.outputs.released == 'true'
        run: ./scripts/ci/build.sh

      - name: Create alpha prerelease (tag-only during seam window)
        if: steps.ver.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --prerelease \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "$TAG"

      # Upload ONLY IF build.sh produced an artifact. During the seam window
      # dist/ is empty, so this is skipped and the alpha stays tag-only.
      - name: Upload alpha artifact (if produced)
        if: steps.ver.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          shopt -s nullglob
          assets=(dist/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No artifact produced (seam window) — alpha $TAG is tag-only."
            exit 0
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
