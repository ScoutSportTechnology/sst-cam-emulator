name: alpha

# On every push to develop (i.e. a merged PR), mint the next alpha prerelease.
# Conventional-commit scan since the last stable tag decides the bump; a
# docs/chore-only merge resolves released=false and mints nothing (expected,
# not a failure).
#
# SEAM WINDOW: scripts/ci/build.sh produces no artifact yet, so the alpha is
# TAG-ONLY (prerelease Release, no asset). The upload step is conditional on a
# produced artifact under dist/ — an unconditional upload of a nonexistent file
# would fail the run, so it must stay gated. When the bridge fills build.sh, the
# same step uploads the real artifact with no workflow change.
#
# Default GITHUB_TOKEN only (contents: write); the v* tag ruleset permits
# compliant prerelease tag creation, so no PAT/App is needed.

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      version:
        description: "Force base version eg v0.1.0 (overrides auto-detect)"
        required: false
        default: ""
      bump:
        description: "Force bump level (overrides auto-detect)"
        type: choice
        options: ["", patch, minor, major]
        default: ""

permissions:
  contents: write

concurrency:
  group: alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve alpha version
        id: ver
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUMP: ${{ inputs.bump }}
        run: ./scripts/ci/resolve-version.sh alpha

      - name: Build alpha artifact
        if: steps.ver.outputs.released == 'true'
        run: ./scripts/ci/build.sh

      - name: Create alpha prerelease (tag-only during seam window)
        if: steps.ver.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --prerelease \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "$TAG"

      # Upload ONLY IF build.sh produced an artifact. During the seam window
      # dist/ is empty, so this is skipped and the alpha stays tag-only.
      - name: Upload alpha artifact (if produced)
        if: steps.ver.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          shopt -s nullglob
          assets=(dist/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No artifact produced (seam window) — alpha $TAG is tag-only."
            exit 0
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
